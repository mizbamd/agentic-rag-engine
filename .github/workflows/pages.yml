name: Deploy Learning Campus

# GitHub Pages is not enabled on this repo. The last on-push deploy failed with
# "Create Pages site failed. Resource not accessible by integration" — only the
# repo owner can turn Pages on in Settings. Do not run on push until then.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build campus
        working-directory: learning-campus
        run: npm ci && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: learning-campus/dist
      - id: deployment
        uses: actions/deploy-pages@v4
